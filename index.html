<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scheda della Giornata</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Giornata">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: una colonna calma su telefono; su PC due colonne — a sinistra il filo della giornata, a destra requisiti, cose da fare e obiettivi. Il colore indica il momento del giorno. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#16202A; --muted:#5A6977; --line:#D8E0E7;
  --accent:#0B7A6A; --accent-ink:#FFFFFF; --accent-soft:#D5EEE8;
  --morning:#C97B10; --morning-soft:#FBEBD3;
  --afternoon:#1F7FA8; --afternoon-soft:#D7ECF5;
  --evening:#5E4FC4; --evening-soft:#E5E1F7;
  --allday:#5A6977; --allday-soft:#E5EAEE;
  --warn:#A86400; --warn-soft:#FBEBCF; --urgent:#B93A29; --urgent-soft:#F8DDD8;
  --h0:#E1E7EC; --h1:#CDEBE4; --h2:#93D3C4; --h3:#3FAE97; --h4:#0B7A6A; --h-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(22,32,42,.05),0 6px 18px rgba(22,32,42,.06);
  --backdrop:rgba(16,24,32,.42);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --r-s:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F151B; --surface:#18212A; --surface-2:#1E2933; --ink:#E7EDF2; --muted:#94A4B3; --line:#2B3845;
  --accent:#3CC4A7; --accent-ink:#06231D; --accent-soft:#173B35;
  --morning:#F0B357; --morning-soft:#3A2C17;
  --afternoon:#5BB8DF; --afternoon-soft:#16303D;
  --evening:#A193F2; --evening-soft:#28244A;
  --allday:#94A4B3; --allday-soft:#24303B;
  --warn:#F0AB45; --warn-soft:#3A2B12; --urgent:#F07D6D; --urgent-soft:#3F201C;
  --h0:#24303B; --h1:#173B35; --h2:#1F5E52; --h3:#2A907B; --h4:#3CC4A7; --h-ink:#06231D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(160px + env(safe-area-inset-bottom,0px))}

/* navigazione */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:12.5px;font-weight:700}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.brand{display:none}
@media (min-width:900px){
  .app{padding-bottom:48px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:10px;margin-bottom:6px}
  .brand{display:block;font-family:var(--f-display);font-weight:800;font-size:20px}
  .nav{position:static;border:1px solid var(--line);border-radius:14px;padding:4px;background:var(--surface)}
  .nav button{flex-direction:row;gap:8px;padding:8px 16px;font-size:15px;max-width:none}
  .nav button svg{width:20px;height:20px}
}

.banner{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:var(--r-s);padding:10px 12px 10px 14px;margin-bottom:12px;font-size:15px}
.banner button{flex:none;font-weight:700;color:var(--warn);padding:2px 4px}

/* card e sezioni */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{font-size:20px;font-weight:800}
.page-h{font-size:30px;font-weight:800}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}

/* hero */
.hero{display:flex;align-items:center;gap:12px;padding-block:6px 4px}
.hero .dn{flex:1;min-width:0}
.hero h1{font-size:clamp(25px,6vw,36px);font-weight:800;line-height:1.05}
.hero .sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px;color:var(--muted);font-size:15px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.link{background:var(--accent-soft);color:var(--accent)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--line)}
.ring .pr{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px}
.hero.celebrate .ring{animation:pop .7s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* focus */
.focus label{display:block}
.focus input{width:100%;margin-top:6px;border:0;border-bottom:2px dashed var(--line);background:transparent;padding:6px 0;font-family:var(--f-display);font-size:20px;font-weight:600;border-radius:0}
.focus input:focus{outline:none;border-bottom-color:var(--accent)}
.focus input::placeholder{color:var(--muted);opacity:.7;font-weight:600}

/* adesso */
.now{border-left:6px solid var(--pc,var(--accent))}
.now .clock{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.now .what{font-family:var(--f-display);font-size:clamp(22px,5.4vw,28px);font-weight:800;margin:6px 0 2px;line-height:1.15;overflow-wrap:anywhere}
.now .when{color:var(--muted)}
.now .when b{font-family:var(--f-display);font-size:20px;color:var(--pc);font-variant-numeric:tabular-nums}
.now .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.now .then{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
.now .then b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface-2);color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{color:var(--urgent)}
.btn.armed{background:var(--urgent);color:#fff}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* timeline */
.part{margin-top:14px}
.part:first-child{margin-top:0}
.part-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:700;color:var(--pc)}
.part-h .dot{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.part-h .cnt{margin-left:auto;color:var(--muted);font-size:14px;font-weight:400}
.p-mattina{--pc:var(--morning);--ps:var(--morning-soft)}
.p-pomeriggio{--pc:var(--afternoon);--ps:var(--afternoon-soft)}
.p-sera{--pc:var(--evening);--ps:var(--evening-soft)}
.p-giornata{--pc:var(--allday);--ps:var(--allday-soft)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:stretch;border-radius:12px;background:var(--surface-2);min-height:56px}
.item .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 10px;text-align:left;border-radius:12px}
.tcol{flex:none;width:64px;font-family:var(--f-display);font-size:23px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--pc);font-variant-numeric:tabular-nums}
.tcol.none{font-size:13px;font-family:var(--f-body);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);opacity:.8}
.check{width:28px;height:28px;border-radius:9px;border:2.5px solid var(--pc,var(--accent));display:grid;place-items:center;flex:none;background:var(--surface)}
.check svg{width:18px;height:18px;stroke:var(--surface);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.is-done .check{background:var(--pc,var(--accent))}
.is-done .check svg{opacity:1;animation:tick .25s ease}
@keyframes tick{from{transform:scale(.4)}to{transform:scale(1)}}
.item .txt{min-width:0;display:flex;flex-direction:column}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.is-done .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.is-done .tcol{opacity:.55}
.is-skip{opacity:.6}
.is-skip .check{border-style:dashed}
.is-skip .t{color:var(--muted)}
.is-now{background:var(--ps);box-shadow:inset 0 0 0 2px var(--pc)}
.more{width:44px;flex:none;display:grid;place-items:center;color:var(--muted);border-radius:12px}
.more svg{width:20px;height:20px;fill:currentColor}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--surface);color:var(--muted)}
.tag.ex{background:var(--warn-soft);color:var(--warn)}
.empty{padding:14px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.empty .btn{margin-top:10px}
.alldone{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:12px;padding:12px 14px}
.alldone svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:3;flex:none}

/* requisiti */
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.req{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.req.wide{grid-column:1/-1}
.req .t{font-weight:700;overflow-wrap:anywhere}
.req .v{font-size:14px;color:var(--muted)}
.req.full{background:var(--accent-soft)}
.req.full .v{color:var(--accent);font-weight:700}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.req .ctl{display:flex;gap:6px;margin-top:auto}
.req .ctl button{flex:1;min-height:42px;border-radius:10px;background:var(--surface);font-weight:700;font-size:20px;line-height:1}
.req .ctl button.wide{font-size:15px}
.req.full .ctl button.wide{background:var(--accent);color:var(--accent-ink)}
.req .wide-ctl{display:flex;gap:6px}
.req .wide-ctl button{min-width:56px}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.notes button{display:flex;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:var(--surface);align-items:baseline}
.notes .n{flex:none;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;font-size:14px}
.notes .d{min-width:0;overflow-wrap:anywhere}
.notes .d.no{color:var(--muted);font-style:italic}

/* todo */
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}
.field,.addrow input,select,textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%}
.field:focus,.addrow input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.todo .acts{display:flex}
.todo .acts button{width:40px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.todo .acts svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.todo .main{padding-left:12px}
.carry{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);border-radius:12px;padding:8px 8px 8px 12px;margin-bottom:8px;font-size:15px;flex-wrap:wrap}

/* obiettivi */
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.lv-calm{background:var(--accent-soft);color:var(--accent)}
.lv-warn{background:var(--warn-soft);color:var(--warn)}
.lv-urgent{background:var(--urgent-soft);color:var(--urgent)}
.lv-over{background:var(--urgent);color:#fff}
.lv-none{background:var(--surface-2);color:var(--muted)}
.gmini{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.gmini:first-of-type{border-top:0;padding-top:0}
.gmini .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gmini .top b{overflow-wrap:anywhere}
.step{display:flex;align-items:center;gap:10px;padding:6px 0;text-align:left;width:100%}
.step .check{width:24px;height:24px;border-radius:7px}
.step .check svg{width:15px;height:15px}
.step span{min-width:0;overflow-wrap:anywhere}
.goal{display:flex;flex-direction:column;gap:12px}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal h3{font-size:21px;font-weight:800;overflow-wrap:anywhere;min-width:0}
.goal .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}
.bars{display:grid;gap:8px}
.bars .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:3px}
.bar.time b{background:var(--muted)}
.goal .steps{list-style:none;margin:0;padding:0}
.goal .steps li{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.goal .steps li .step{flex:1;min-width:0;padding:10px 0}
.goal .steps li.is-done .step span{text-decoration:line-through;color:var(--muted)}
.goal .steps li.is-next .step span{font-weight:700}
.goal .steps .x{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.goal .steps .x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.goal .foot{display:flex;gap:8px;flex-wrap:wrap}
.goal.reached{opacity:.75}
.goals{display:grid;gap:14px}
@media (min-width:900px){.goals{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.seg{display:inline-flex;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.seg button{padding:6px 14px;border-radius:9px;font-weight:700;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* storico */
.hist-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pnav{display:flex;align-items:center;gap:10px}
.pnav h2{font-size:21px;font-weight:800;min-width:9ch;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wh{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal .c{aspect-ratio:1/1.05;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--surface-2);color:var(--ink);min-width:0}
.cal .c .dd{font-size:12px;font-weight:700;opacity:.75}
.cal .c .pp{font-size:clamp(11px,3.3vw,15px);font-weight:800;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.cal .c.fut{opacity:.4}
.cal .c.today{box-shadow:inset 0 0 0 2.5px var(--ink)}
.b0{background:var(--h0)!important}
.b1{background:var(--h1)!important}
.b2{background:var(--h2)!important}
.b3{background:var(--h3)!important;color:var(--h-ink)!important}
.b4{background:var(--h4)!important;color:var(--h-ink)!important}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.chart{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;height:180px;margin-top:22px;border-bottom:1.5px solid var(--line)}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.chart .gl span{position:absolute;left:0;top:-15px;font-size:11px;color:var(--muted)}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;position:relative;z-index:1}
.col .v{position:absolute;left:0;right:0;text-align:center;bottom:calc(var(--h,0%) + 3px);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.col .bb{width:100%;max-width:44px;border-radius:7px 7px 0 0;height:var(--h,0%);min-height:3px}
.col.nodata .bb{background:transparent;border:1.5px dashed var(--line);border-bottom:0;height:10px}
.xl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:6px}
.xl span{text-align:center;font-size:12px;color:var(--muted);font-weight:700;overflow:hidden}
.col.cur .v{color:var(--accent)}

/* imposta */
.setrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;background:var(--surface-2);border-radius:12px;min-height:52px}
.setrow .bullet{width:10px;height:10px;border-radius:50%;background:var(--pc,var(--accent));flex:none}
.setrow .txt{flex:1;min-width:0}
.setrow .t{font-weight:700;overflow-wrap:anywhere}
.setrow .m{font-size:13px;color:var(--muted)}
.setrow svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;flex:none}
.note{font-size:14px;color:var(--muted);max-width:65ch}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* FAB */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:21;width:60px;height:60px;border-radius:20px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(11,122,106,.35);display:grid;place-items:center}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:3;stroke-linecap:round;fill:none}
@media (min-width:900px){.fab{bottom:calc(28px + env(safe-area-inset-bottom,0px))}}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:40;background:var(--backdrop);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:22px;padding-bottom:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:14px}
.sheet h2+.muted{margin:-10px 0 14px}
.form{display:flex;flex-direction:column;gap:14px}
.form label.l{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.form .hint{font-weight:400;font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{position:relative}
.days input{position:absolute;opacity:0;inset:0;margin:0}
.days span{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--surface-2);font-weight:700;color:var(--muted)}
.days input:checked+span{background:var(--accent);color:var(--accent-ink)}
.days input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.radios{display:flex;flex-direction:column;gap:8px}
.radios label{display:flex;gap:10px;align-items:center;font-weight:400;flex-wrap:wrap}
.radios input[type=radio]{width:20px;height:20px;accent-color:var(--accent)}
.checkline{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.checkline input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.checkline .hint{display:block}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.sheet .foot .r{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px;border-radius:14px;background:var(--surface-2);min-height:84px}
.choice b{font-size:17px}
.choice span{font-size:13px;color:var(--muted)}
.choice.wide{grid-column:1/-1;background:var(--accent-soft)}
.choice.wide b{color:var(--accent)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start}

.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">La mia giornata</div>
    <nav class="nav" role="tablist" aria-label="Sezioni">
      <button role="tab" data-tab="oggi" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Oggi</button>
      <button role="tab" data-tab="obiettivi" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Obiettivi</button>
      <button role="tab" data-tab="storico" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Storico</button>
      <button role="tab" data-tab="imposta" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Routine</button>
    </nav>
  </div>
  <div id="banner" class="banner" hidden></div>
  <main id="v-oggi" class="stack"></main>
  <main id="v-obiettivi" class="stack" hidden></main>
  <main id="v-storico" class="stack" hidden></main>
  <main id="v-imposta" class="stack" hidden></main>
</div>
<button class="fab" data-act="fab" aria-label="Aggiungi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="backdrop" class="backdrop" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="restore-in" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
const DSH=['L','M','M','G','V','S','D'];
const DLONG=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const DMID=['lun','mar','mer','gio','ven','sab','dom'];
const MONTHS=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MSH=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const PARTS=[['giornata','In giornata'],['mattina','Mattina'],['pomeriggio','Pomeriggio'],['sera','Sera']];
const PLABEL=Object.fromEntries(PARTS);
const PORDER={giornata:0,mattina:1,pomeriggio:2,sera:3};
const KINDS=['routine','reqs','events','goals'];
const ALLDAYS=[0,1,2,3,4,5,6];
const LS_KEY='scheda-giornata-v1';
const IC={
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  later:'<svg viewBox="0 0 24 24"><path d="M5 12h12M13 6l6 6-6 6"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ---------- date ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const wd=k=>(parseKey(k).getDay()+6)%7;
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/86400000);
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const hmToMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const partOfTime=t=>{if(!t)return null;const h=+t.slice(0,2);return h<12?'mattina':h<18?'pomeriggio':'sera'};
const longDate=k=>{const d=parseKey(k);return DLONG[wd(k)]+' '+d.getDate()+' '+MONTHS[d.getMonth()]};
const shortDate=k=>{const d=parseKey(k);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
function relDay(k){const n=diffDays(todayKey(),k);
  if(n===0)return 'Oggi';if(n===1)return 'Domani';if(n===-1)return 'Ieri';
  return n>0?'tra '+n+' giorni':n*-1+' giorni fa'}
function daysText(days){
  if(!days||days.length===0||days.length===7)return 'ogni giorno';
  const s=[...days].sort().join('');
  if(s==='01234')return 'lun–ven';if(s==='56')return 'weekend';
  return [...days].sort().map(i=>DMID[i]).join(' ');
}
const fmtMin=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');

/* ---------- util ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const arr=v=>Array.isArray(v)?v:[];
const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};

/* ---------- dati (salvati nel browser di questo dispositivo) ---------- */
function normData(d){d=obj(d);return {v:1,routine:arr(d.routine),reqs:arr(d.reqs),events:arr(d.events),goals:arr(d.goals),days:obj(d.days),meta:obj(d.meta)}}
function loadData(){try{const r=localStorage.getItem(LS_KEY);if(r)return normData(JSON.parse(r))}catch(e){}return null}
function seedData(){
  const t=todayKey();const sat=addDays(t,(5-wd(t)+7)%7);const all=ALLDAYS.slice();
  const r=(id,title,time,part,days,order)=>({id,title,time,part,days,order,example:true});
  return normData({
    routine:[r('ex-r1',"Sveglia e un bicchiere d'acqua",'07:30','mattina',all,0),r('ex-r2','Colazione','07:45','mattina',all,1),r('ex-r3','Doccia e vestirsi','08:00','mattina',[0,1,2,3,4],2),
      r('ex-r4','2 minuti su questa scheda: scegli la cosa più importante','08:30','mattina',all,3),r('ex-r5','Pausa pranzo lontano dallo schermo','13:00','pomeriggio',[0,1,2,3,4],4),
      r('ex-r6','10 minuti a piedi','16:30','pomeriggio',all,5),r('ex-r7','Prepara le cose per domani','21:30','sera',[0,1,2,3,6],6),r('ex-r8','Schermi spenti, a letto','23:15','sera',all,7)],
    reqs:[{id:'ex-q1',title:'Bere acqua',target:8,unit:'bicchieri',days:all,describe:false,example:true},
      {id:'ex-q2',title:'Pasti veri',target:3,unit:'pasti',days:all,describe:true,prompt:'Cosa hai mangiato?',example:true},
      {id:'ex-q3',title:'Allenamento',target:1,unit:'',days:[0,2,4],describe:true,prompt:'Che allenamento hai fatto?',example:true}],
    events:[{id:'ex-e1',title:'Spesa settimanale',date:sat,time:'10:00',weekly:true,note:'',example:true}],
    goals:[{id:'ex-g1',title:'Leggere un libro intero',deadline:addDays(t,61),horizon:'2 mesi',note:'Per staccare dagli schermi la sera.',createdAt:t,done:false,example:true,
      steps:[{id:'s1',text:'Scegliere il libro',done:false},{id:'s2',text:'Leggere 10 pagine prima di dormire',done:false},{id:'s3',text:'Arrivare a metà',done:false}]}],
    days:{},meta:{createdAt:t}
  });
}
let D=loadData();if(!D)D=seedData();

function emptyDay(){return {done:{},req:{},notes:{},todos:[],focus:''}}
function normDay(b){b=b?clone(b):{};return {done:obj(b.done),req:obj(b.req),notes:obj(b.notes),todos:arr(b.todos),focus:typeof b.focus==='string'?b.focus:'',snap:b.snap}}

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true},2600)}
let saveWarned=false;
function persist(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(D));saveWarned=false}
  catch(e){if(!saveWarned){saveWarned=true;toast('Non riesco a salvare: la memoria del browser è piena o bloccata.')}}
}
function snapshot(key){const day=D.days[key];if(!day)return;const st=stats(key,day);day.snap={pct:Math.round(st.pct*1000)/1000,done:st.done,total:st.total}}
function commit(){if(D.days[S.date])snapshot(S.date);persist()}

/* ---------- stato ---------- */
const S={day:emptyDay(),date:todayKey(),tab:'oggi',prevLeft:null,goalFilter:'attivi',lastPct:null,hist:{mode:'giorni',y:new Date().getFullYear(),m:new Date().getMonth()}};

function saveItem(kind,item){
  const id=item.id||uid();const v=clone(item);v.id=id;
  const i=D[kind].findIndex(x=>x.id===id);if(i>=0)D[kind][i]=v;else D[kind].push(v);
  commit();render();
}
function removeItem(kind,id){D[kind]=D[kind].filter(x=>x.id!==id);commit();render()}
function mutateDay(key,fn){const b=normDay(D.days[key]);fn(b);D.days[key]=b;snapshot(key);persist()}
function touchDay(){D.days[S.date]=S.day;commit();render()}
function loadDay(){
  S.day=D.days[S.date]?D.days[S.date]=normDay(D.days[S.date]):emptyDay();
  S.lastPct=null;
  const pk=addDays(S.date,-1);const pb=D.days[pk];const left=pb?arr(pb.todos).filter(t=>!t.done):[];
  S.prevLeft=left.length?{key:pk,left}:null;
}
function goDate(k){S.date=k;loadDay();render();window.scrollTo({top:0})}

/* ---------- calcoli ---------- */
const forDay=(list,k)=>{const w=wd(k);return list.filter(r=>!Array.isArray(r.days)||r.days.length===0||r.days.includes(w))};
function eventsFor(k){const w=wd(k);return D.events.filter(e=>e.date===k||(e.weekly&&e.date&&e.date<=k&&wd(e.date)===w))}
function timeline(k){
  const items=[
    ...forDay(D.routine,k).map(r=>({kind:'routine',id:r.id,title:r.title,time:r.time||'',part:partOfTime(r.time)||r.part||'mattina',order:r.order||0,example:r.example,note:''})),
    ...eventsFor(k).map(e=>({kind:'events',id:e.id,title:e.title,time:e.time||'',part:partOfTime(e.time)||'giornata',order:0,example:e.example,note:e.note||'',weekly:e.weekly}))
  ];
  items.sort((a,b)=>PORDER[a.part]-PORDER[b.part]||(a.time?0:1)-(b.time?0:1)||(a.time||'').localeCompare(b.time||'')||a.order-b.order||String(a.title).localeCompare(String(b.title)));
  return items;
}
function stats(k,day){
  day=day||S.day;const tl=timeline(k);const reqs=forDay(D.reqs,k);const d=obj(day.done);const rq=obj(day.req);
  let total=0,done=0,units=0,unitsDone=0;
  tl.forEach(i=>{if(d[i.id]==='s')return;total++;units++;if(d[i.id]){done++;unitsDone++}});
  reqs.forEach(r=>{const t=Math.max(1,+r.target||1);const c=Math.min(t,+rq[r.id]||0);total++;units++;unitsDone+=c/t;if(c>=t)done++});
  return {tl,reqs,total,done,pct:units?unitsDone/units:0};
}
function countdown(dl){
  if(!dl)return {txt:'senza scadenza',lv:'none',n:null};
  const n=diffDays(todayKey(),dl);let txt;
  if(n<0)txt='scaduto da '+(-n)+(n===-1?' giorno':' giorni');
  else if(n===0)txt='scade oggi';else if(n===1)txt='scade domani';
  else if(n<=45)txt='tra '+n+' giorni';else txt='tra circa '+Math.round(n/30.4)+' mesi';
  const lv=n<0?'over':n<=7?'urgent':n<=30?'warn':'calm';
  return {txt,lv,n};
}
function goalSort(a,b){return (a.deadline?0:1)-(b.deadline?0:1)||String(a.deadline||'').localeCompare(String(b.deadline||''))||String(a.createdAt||'').localeCompare(String(b.createdAt||''))}

/* percentuale registrata di un giorno: null se quel giorno non è stato usato */
function dayPct(k){const d=D.days[k];if(!d||!d.snap||!d.snap.total)return null;return d.snap.pct}
function bucket(p){return p==null?'':p>=1?'b4':p>=.75?'b3':p>=.5?'b2':p>=.25?'b1':'b0'}
function avgOf(keys){const v=keys.map(dayPct).filter(p=>p!=null);return v.length?{avg:v.reduce((a,b)=>a+b,0)/v.length,n:v.length,full:v.filter(p=>p>=1).length}:{avg:null,n:0,full:0}}
function keysInMonth(y,m){const n=new Date(y,m+1,0).getDate();const t=todayKey();const out=[];for(let d=1;d<=n;d++){const k=y+'-'+pad(m+1)+'-'+pad(d);if(k<=t)out.push(k)}return out}
function keysInYear(y){return Object.keys(D.days).filter(k=>k.slice(0,4)===String(y))}
const pctTxt=p=>p==null?'—':Math.round(p*100)+'%';

/* ---------- render ---------- */
function render(){
  const a=document.activeElement;let st=null;
  if(a&&a.id&&/INPUT|TEXTAREA/.test(a.tagName)&&!a.closest('#sheet')){st={id:a.id,v:a.value,s:a.selectionStart,e:a.selectionEnd}}
  document.querySelectorAll('.nav [data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  ['oggi','obiettivi','storico','imposta'].forEach(t=>{$('#v-'+t).hidden=t!==S.tab});
  if(S.tab==='oggi')renderOggi();else if(S.tab==='obiettivi')renderGoals();else if(S.tab==='storico')renderHist();else renderSetup();
  if(st){const el=document.getElementById(st.id);if(el){el.value=st.v;el.focus({preventScroll:true});try{el.setSelectionRange(st.s,st.e)}catch(e){}}}
}

function itemRow(i,nowId){
  const v=S.day.done[i.id];const cls=['item','p-'+i.part,v===true?'is-done':'',v==='s'?'is-skip':'',i.id===nowId?'is-now':''].join(' ');
  const meta=[];
  if(i.kind==='events')meta.push('<span class="tag">impegno'+(i.weekly?' · ogni sett.':'')+'</span>');
  if(v==='s')meta.push('<span>saltato oggi</span>');
  if(i.example)meta.push('<span class="tag ex">esempio</span>');
  if(i.note)meta.push('<span>'+esc(i.note)+'</span>');
  const tc=i.time?'<span class="tcol">'+esc(i.time)+'</span>':'<span class="tcol none">'+(i.part==='giornata'?'oggi':'—')+'</span>';
  return '<li class="'+cls+'"><button class="main" data-act="toggle" data-id="'+esc(i.id)+'" aria-pressed="'+(v===true)+'">'+tc+'<span class="check">'+IC.check+'</span><span class="txt"><span class="t">'+esc(i.title)+'</span>'+(meta.length?'<span class="m">'+meta.join('')+'</span>':'')+'</span></button><button class="more" data-act="itemmenu" data-kind="'+i.kind+'" data-id="'+esc(i.id)+'" aria-label="Opzioni per '+esc(i.title)+'">'+IC.more+'</button></li>';
}

function nowPick(tl){
  const d=S.day.done;const open=tl.filter(i=>!d[i.id]);if(!open.length)return null;
  /* prima ciò che appartiene al momento attuale, poi la prossima cosa con orario; le cose rimaste indietro restano nel filo */
  const now=nowHM();const cp=partOfTime(now);const nm=hmToMin(now);
  let first=open.find(i=>i.part===cp&&(!i.time||hmToMin(i.time)<=nm+15))
    ||open.find(i=>i.time&&hmToMin(i.time)>nm)
    ||open.find(i=>i.part!=='giornata')||open[0];
  const rest=open.filter(i=>i!==first&&i.part!=='giornata');
  const next=rest.find(i=>tl.indexOf(i)>tl.indexOf(first))||null;
  return {first,next};
}

function reqTile(r){
  const t=Math.max(1,+r.target||1);const c=Math.min(t,+S.day.req[r.id]||0);const full=c>=t;const id=esc(r.id);
  const notes=arr(S.day.notes[r.id]);
  const vis=t<=12?'<div class="dots" aria-hidden="true">'+Array.from({length:t},(_,i)=>'<i class="'+(i<c?'on':'')+'"></i>').join('')+'</div>':'<div class="bar"><b style="width:'+(c/t*100)+'%"></b></div>';
  const label=r.unit?r.unit:'';
  const value=t===1?(full?'Fatto':'Da fare'):c+' / '+t+(label?' '+esc(label):'');
  let ctl;
  if(t===1)ctl='<div class="ctl"><button class="wide" data-act="req-tog" data-id="'+id+'">'+(full?'Fatto':'Segna fatto')+'</button></div>';
  else ctl='<div class="ctl"><button data-act="req-dec" data-id="'+id+'" aria-label="Togli uno">−</button><button data-act="req-inc" data-id="'+id+'" aria-label="Aggiungi uno">+</button></div>';
  let list='';
  if(r.describe&&c>0){
    list='<ol class="notes">'+Array.from({length:c},(_,i)=>{const n=notes[i]||'';

function goalCard(g){
  const cd=countdown(g.deadline);const steps=arr(g.steps);const dn=steps.filter(s=>s.done).length;const nx=steps.find(s=>!s.done);
  let time='';
  if(g.deadline&&g.createdAt){const tot=Math.max(1,diffDays(g.createdAt,g.deadline));const el=Math.min(tot,Math.max(0,diffDays(g.createdAt,todayKey())));
    time='<div><div class="lbl"><span>Tempo passato</span><span class="num">'+Math.round(el/tot*100)+'%</span></div><div class="bar time"><b style="width:'+(el/tot*100)+'%"></b></div></div>'}
  const prog=steps.length?'<div><div class="lbl"><span>Passi fatti</span><span class="num">'+dn+' di '+steps.length+'</span></div><div class="bar"><b style="width:'+(dn/steps.length*100)+'%"></b></div></div>':'';
  return '<article class="card goal'+(g.done?' reached':'')+'"><div class="top"><h3>'+esc(g.title)+'</h3><span class="chip lv-'+(g.done?'calm':cd.lv)+'">'+(g.done?'raggiunto':esc(cd.txt))+'</span></div>'
    +'<div class="meta">'+(g.deadline?'<span>Scadenza '+esc(shortDate(g.deadline))+'</span>':'')+(g.horizon?'<span>· orizzonte '+esc(g.horizon)+'</span>':'')+(g.example?'<span class="tag ex">esempio</span>':'')+'</div>'
    +(g.note?'<p class="muted" style="margin:0;overflow-wrap:anywhere">'+esc(g.note)+'</p>':'')
    +((time||prog)?'<div class="bars">'+prog+time+'</div>':'')
    +(steps.length?'<ul class="steps">'+steps.map(s=>'<li class="'+(s.done?'is-done':'')+(nx&&nx.id===s.id?' is-next':'')+'"><button class="step" data-act="step-tog" data-goal="'+esc(g.id)+'" data-id="'+esc(s.id)+'" aria-pressed="'+!!s.done+'"><span class="check">'+IC.check+'</span><span>'+esc(s.text)+'</span></button><button class="x" data-act="step-del" data-goal="'+esc(g.id)+'" data-id="'+esc(s.id)+'" aria-label="Elimina passo">'+IC.x+'</button></li>').join('')+'</ul>':'')
    +(g.done?'':'<form class="addrow step-form" data-goal="'+esc(g.id)+'" style="margin-top:0"><input id="step-in-'+esc(g.id)+'" placeholder="Aggiungi un passo piccolo" autocomplete="off" maxlength="200" aria-label="Nuovo passo"><button class="btn" type="submit">Aggiungi</button></form>')
    +'<div class="foot"><button class="btn small'+(g.done?'':' primary')+'" data-act="goal-done" data-id="'+esc(g.id)+'">'+(g.done?'Riattiva':'Segna come raggiunto')+'</button><button class="btn small" data-act="edit" data-kind="goals" data-id="'+esc(g.id)+'">Modifica</button></div></article>';
}

function renderHist(){
  const H=S.hist;const mode=H.mode;const now=new Date();const t=todayKey();
  let h='<div class="hist-top"><h1 class="page-h">Storico</h1><div class="seg" role="group" aria-label="Vista"><button data-act="hmode" data-v="giorni" aria-pressed="'+(mode==='giorni')+'">Giorni</button><button data-act="hmode" data-v="mesi" aria-pressed="'+(mode==='mesi')+'">Mesi</button><button data-act="hmode" data-v="anni" aria-pressed="'+(mode==='anni')+'">Anni</button></div></div>';
  h+='<p class="note" style="margin:0">La percentuale di un giorno conta routine, impegni e requisiti di quel giorno. Le cose saltate non contano. Un giorno in cui non hai segnato niente resta vuoto.</p>';
  const legend='<div class="legend"><span><i class="b0"></i>0–24%</span><span><i class="b1"></i>25–49%</span><span><i class="b2"></i>50–74%</span><span><i class="b3"></i>75–99%</span><span><i class="b4"></i>100%</span></div>';

  if(mode==='giorni'){
    const y=H.y,m=H.m;const keys=keysInMonth(y,m);const a=avgOf(keys);
    const isCur=y===now.getFullYear()&&m===now.getMonth();
    const first=new Date(y,m,1);const lead=(first.getDay()+6)%7;const nDays=new Date(y,m+1,0).getDate();
    let cal='<div class="cal">'+DSH.map(d=>'<div class="wh">'+d+'</div>').join('');
    for(let i=0;i<lead;i++)cal+='<div></div>';
    for(let d=1;d<=nDays;d++){const k=y+'-'+pad(m+1)+'-'+pad(d);const p=dayPct(k);const fut=k>t;
      cal+='<button class="c '+bucket(p)+(fut?' fut':'')+(k===t?' today':'')+'" data-act="openday" data-k="'+k+'" aria-label="'+esc(longDate(k))+': '+(p==null?'nessun dato':Math.round(p*100)+'%')+'"><span class="dd num">'+d+'</span><span class="pp">'+(fut?'':p==null?'·':Math.round(p*100))+'</span></button>'}
    cal+='</div>';
    let streak=0;{let k=t;if(dayPct(k)==null||dayPct(k)<.8)k=addDays(k,-1);while(dayPct(k)!=null&&dayPct(k)>=.8){streak++;k=addDays(k,-1)}}
    h+='<section class="card stack"><div class="pnav"><button class="iconbtn" data-act="hprev" aria-label="Mese precedente">'+IC.left+'</button><h2>'+MONTHS[m]+' '+y+'</h2><button class="iconbtn" data-act="hnext" aria-label="Mese successivo"'+(isCur?' disabled style="opacity:.35"':'')+'>'+IC.right+'</button></div>'
      +'<div class="kpis"><div class="kpi"><b>'+pctTxt(a.avg)+'</b><span>media del mese</span></div><div class="kpi"><b class="num">'+a.n+'</b><span>giorni registrati</span></div><div class="kpi"><b class="num">'+a.full+'</b><span>giornate al 100%</span></div>'+(isCur?'<div class="kpi"><b class="num">'+streak+'</b><span>giorni di fila sopra l\'80%</span></div>':'')+'</div>'
      +cal+legend+'<p class="note" style="margin:0">Tocca un giorno per aprirlo e vedere cosa hai fatto e le descrizioni dei requisiti.</p></section>';
  }else if(mode==='mesi'){
    const y=H.y;const isCur=y===now.getFullYear();
    const vals=MSH.map((_,m)=>avgOf(keysInMonth(y,m)));
    const ya=avgOf(keysInYear(y));
    h+='<section class="card stack"><div class="pnav"><button class="iconbtn" data-act="hprev" aria-label="Anno precedente">'+IC.left+'</button><h2 class="num">'+y+'</h2><button class="iconbtn" data-act="hnext" aria-label="Anno successivo"'+(isCur?' disabled style="opacity:.35"':'')+'>'+IC.right+'</button></div>'
      +'<div class="kpis"><div class="kpi"><b>'+pctTxt(ya.avg)+'</b><span>media dell\'anno</span></div><div class="kpi"><b class="num">'+ya.n+'</b><span>giorni registrati</span></div><div class="kpi"><b class="num">'+ya.full+'</b><span>giornate al 100%</span></div></div>'
      +chart(vals.map((v,m)=>({v:v.avg,n:v.n,lab:MSH[m],act:'openmonth',arg:m,cur:isCur&&m===now.getMonth(),aria:MONTHS[m]+' '+y})))
      +legend+'<p class="note" style="margin:0">Ogni barra è la media dei giorni registrati in quel mese. Tocca un mese per vederne i giorni.</p></section>';
  }else{
    const ys=Object.keys(D.days).map(k=>+k.slice(0,4));const cy=now.getFullYear();
    const min=Math.min(cy,...(ys.length?ys:[cy]));const years=[];for(let y=min;y<=cy;y++)years.push(y);
    const all=avgOf(Object.keys(D.days));
    h+='<section class="card stack"><div class="kpis"><div class="kpi"><b>'+pctTxt(all.avg)+'</b><span>media di sempre</span></div><div class="kpi"><b class="num">'+all.n+'</b><span>giorni registrati</span></div><div class="kpi"><b class="num">'+all.full+'</b><span>giornate al 100%</span></div></div>'
      +chart(years.map(y=>{const a=avgOf(keysInYear(y));return {v:a.avg,n:a.n,lab:String(y),act:'openyear',arg:y,cur:y===cy,aria:'Anno '+y}}))
      +legend+'<p class="note" style="margin:0">Tocca un anno per vederne i mesi.</p></section>';
  }
  $('#v-storico').innerHTML=h;
}
function chart(cols){
  const gl=[100,50].map(p=>'<div class="gl" style="bottom:'+p+'%" aria-hidden="true"><span>'+p+'%</span></div>').join('');
  return '<div><div class="chart">'+gl+cols.map(c=>'<button class="col'+(c.v==null?' nodata':'')+(c.cur?' cur':'')+'" data-act="'+c.act+'" data-arg="'+c.arg+'" style="--h:'+(c.v==null?0:Math.max(2,c.v*100))+'%" aria-label="'+esc(c.aria)+': '+(c.v==null?'nessun dato':Math.round(c.v*100)+'%')+'"><span class="v">'+(c.v==null?'':Math.round(c.v*100))+'</span><span class="bb '+bucket(c.v)+'"></span></button>').join('')+'</div>'

function openSheet(html,ctx){sheetCtx=ctx||null;$('#sheet').innerHTML=html;$('#backdrop').hidden=false;
  const f=$('#sheet').querySelector('[autofocus]');if(f&&(matchMedia('(min-width:700px)').matches||f.dataset.focusAlways))f.focus()}
function closeSheet(){$('#backdrop').hidden=true;$('#sheet').innerHTML='';sheetCtx=null}
function daysField(sel){sel=sel&&sel.length?sel:ALLDAYS;
  return '<div class="l"><span style="font-weight:700">Giorni</span><div class="days">'+DSH.map((d,i)=>'<label><input type="checkbox" name="days" value="'+i+'"'+(sel.includes(i)?' checked':'')+' aria-label="'+DLONG[i]+'"><span>'+d+'</span></label>').join('')+'</div><div class="presets"><button type="button" class="btn small" data-preset="all">Ogni giorno</button><button type="button" class="btn small" data-preset="work">Lun–ven</button><button type="button" class="btn small" data-preset="we">Weekend</button></div></div>'}
function footer(isEdit){return '<div class="foot">'+(isEdit?'<button type="button" class="btn small danger" data-act="del-item">Elimina</button>':'')+'<div class="r"><button type="button" class="btn ghost" data-act="close">Annulla</button><button type="submit" class="btn primary">Salva</button></div></div>'}

     +'<label class="l">Momento <span class="hint">se senza orario</span><select name="part">'+PARTS.slice(1).map(([p,l])=>'<option value="'+p+'"'+((x&&x.part||'mattina')===p?' selected':'')+'>'+l+'</option>').join('')+'</select></label></div>'

     +'<div class="row2"><label class="l">Quante volte<input class="field" type="number" name="target" min="1" max="50" inputmode="numeric" value="'+esc(x?x.target:1)+'"></label>'
     +'<label class="l">Unità <span class="hint">facoltativa</span><input class="field" name="unit" maxlength="30" value="'+esc(x&&x.unit)+'" placeholder="pasti, bicchieri…"></label></div>'
     +'<label class="checkline"><input type="checkbox" name="describe" id="f-describe"'+(x&&x.describe?' checked':'')+'><span>Chiedi una descrizione ogni volta<span class="hint">Es. cosa hai mangiato o che allenamento hai fatto. Lasciala spenta per le cose già chiare, come bere acqua.</span></span></label>'
     +'<label class="l" id="f-prompt-wrap"'+(x&&x.describe?'':' hidden')+'>Domanda da farti <span class="hint">facoltativa</span><input class="field" name="prompt" maxlength="80" value="'+esc(x&&x.prompt)+'" placeholder="Es. Cosa hai mangiato?"></label>'
     +daysField(x&&x.days)+footer(e)+'</form>';
  }else if(kind==='events'){
    h='<h2>'+(e?'Modifica impegno':'Nuovo impegno')+'</h2><form class="form" id="f-item">'
     +'<label class="l">Impegno<input class="field" name="title" required maxlength="120" autofocus value="'+esc(x&&x.title)+'" placeholder="Es. Dentista"></label>'
     +'<div class="row2"><label class="l">Giorno<input class="field" type="date" name="date" required value="'+esc(x?x.date:S.date)+'"></label>'
     +'<label class="l">Orario <span class="hint">facoltativo</span><input class="field" type="time" name="time" value="'+esc(x&&x.time)+'"></label></div>'
     +'<label class="checkline"><input type="checkbox" name="weekly"'+(x&&x.weekly?' checked':'')+'><span>Si ripete ogni settimana</span></label>'

     +'<div class="l"><span style="font-weight:700">Scadenza</span><div class="radios">'

function submitForm(form){
  const {kind,id,item}=sheetCtx;const fd=new FormData(form);const base=item?clone(item):{};
  const title=String(fd.get('title')||'').trim();if(!title)return;
  base.title=title;base.id=id||uid();delete base.example;
  const days=fd.getAll('days').map(Number);
  if(kind==='routine'){base.time=String(fd.get('time')||'');base.part=String(fd.get('part')||'mattina');base.days=days.length?days:ALLDAYS.slice();if(!id)base.order=D.routine.length}
  else if(kind==='reqs'){base.target=Math.max(1,Math.min(50,parseInt(fd.get('target'),10)||1));base.unit=String(fd.get('unit')||'').trim();base.days=days.length?days:ALLDAYS.slice();base.describe=fd.get('describe')==='on';base.prompt=String(fd.get('prompt')||'').trim()}
  else if(kind==='events'){base.date=String(fd.get('date')||S.date);base.time=String(fd.get('time')||'');base.weekly=fd.get('weekly')==='on';base.note=String(fd.get('note')||'').trim()}
  else if(kind==='goals'){
    const mode=fd.get('mode');base.note=String(fd.get('note')||'').trim();
    if(mode==='none'){base.deadline=null;base.horizon=''}
    else if(mode==='date'){base.deadline=String(fd.get('deadline')||'')||null;base.horizon=''}
    else{const n=Math.max(1,parseInt(fd.get('reln'),10)||1);const u=fd.get('relu');const d=new Date();
      if(u==='d')d.setDate(d.getDate()+n);else if(u==='w')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n);
      base.deadline=keyOf(d);base.horizon=n+' '+(u==='d'?(n===1?'giorno':'giorni'):u==='w'?(n===1?'settimana':'settimane'):(n===1?'mese':'mesi'))}
    if(!id){base.createdAt=todayKey();base.done=false;base.steps=String(fd.get('steps')||'').split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({id:uid(),text:t,done:false}))}
  }
  saveItem(kind,base);closeSheet();toast(id?'Modificato':'Aggiunto');
}
function openItemMenu(kind,id){
  const x=D[kind].find(i=>i.id===id);if(!x)return;const v=S.day.done[id];
  openSheet('<h2>'+esc(x.title)+'</h2><div class="menu">'
    +(v==='s'?'<button class="btn" data-act="unskip" data-id="'+esc(id)+'">Rimetti nella giornata</button>':'<button class="btn" data-act="skip" data-id="'+esc(id)+'">Salta per oggi</button>')
    +'<button class="btn" data-act="edit" data-kind="'+kind+'" data-id="'+esc(id)+'">Modifica'+(kind==='routine'?' (vale per tutti i giorni)':'')+'</button>'
    +'<button class="btn ghost" data-act="close">Chiudi</button></div>');
}

  openSheet('<h2>Cosa vuoi aggiungere?</h2><div class="choices">'
    +'<button class="choice wide" data-act="quick-todo"><b>Una cosa da fare</b><span>Veloce, solo per '+(S.date===todayKey()?'oggi':'il giorno aperto')+'</span></button>'
    +'<button class="choice" data-act="new" data-kind="events"><b>Impegno</b><span>Con giorno e orario</span></button>'

}
/* descrizione di una voce di un requisito: i = posizione; isNew = sto aggiungendo una voce */
function openNote(r,i,isNew){
  const t=Math.max(1,+r.target||1);const cur=arr(S.day.notes[r.id])[i]||'';
  const what=t===1?'':'Voce '+(i+1)+' di '+t;
  openSheet('<h2>'+esc(r.title)+'</h2>'+(what?'<p class="muted">'+what+'</p>':'')
    +'<form class="form" id="f-note"><label class="l">'+esc(r.prompt||'Descrivi')+'<textarea name="note" rows="3" maxlength="400" autofocus data-focus-always="1" placeholder="Scrivi due parole…">'+esc(cur)+'</textarea></label>'
    +'<div class="foot">'+(isNew?'<button type="button" class="btn small ghost" data-act="note-skip">Segna senza descrizione</button>':'<button type="button" class="btn small danger" data-act="note-del">Togli questa voce</button>')
    +'<div class="r"><button type="button" class="btn ghost" data-act="close">Annulla</button><button type="submit" class="btn primary">'+(isNew?'Segna':'Salva')+'</button></div></div></form>',{note:{id:r.id,i,isNew}});
}
function applyNote(text){
  const n=sheetCtx.note;const r=D.reqs.find(x=>x.id===n.id);if(!r){closeSheet();return}
  const t=Math.max(1,+r.target||1);const notes=arr(S.day.notes[r.id]).slice();
  if(n.isNew){const c=+S.day.req[r.id]||0;if(c>=t){closeSheet();return}notes.length=Math.max(notes.length,c);notes[c]=text;S.day.req[r.id]=c+1;if(c+1===t)toast(r.title+': fatto!')}
  else notes[n.i]=text;
  S.day.notes[r.id]=notes.map(x=>x||'');closeSheet();touchDay();
}
function removeNote(){
  const n=sheetCtx.note;const notes=arr(S.day.notes[n.id]).slice();notes.splice(n.i,1);
  S.day.notes[n.id]=notes;S.day.req[n.id]=Math.max(0,(+S.day.req[n.id]||0)-1);closeSheet();touchDay();
}

/* ---------- backup ---------- */
async function doBackup(){
  const t=todayKey();const name='scheda-giornata-backup-'+t+'.json';
  const payload=clone(D);payload.meta.exportedAt=new Date().toISOString();
  const json=JSON.stringify(payload);
  let file;try{file=new File([json],name,{type:'application/json'})}catch(e){file=new Blob([json],{type:'application/json'})}
  const mark=()=>{D.meta.lastBackup=t;persist();render();toast('Backup salvato')};
  if(file instanceof File&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Backup Scheda della Giornata'});mark();return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);mark();
}
function onRestoreFile(f){
  const rd=new FileReader();
  rd.onload=()=>{let d;try{d=JSON.parse(String(rd.result))}catch(e){toast('Questo file non è un backup valido.');return}
    if(!d||typeof d!=='object'||!Array.isArray(d.routine)||typeof d.days!=='object'){toast('Questo file non è un backup della scheda.');return}
    const nd=normData(d);const n=Object.keys(nd.days).length;const when=nd.meta.exportedAt?shortDate(keyOf(new Date(nd.meta.exportedAt))):'data sconosciuta';
    openSheet('<h2>Ripristinare questo backup?</h2><p class="note">Backup del '+esc(when)+': '+n+' giorni registrati, '+nd.routine.length+' passi di routine, '+nd.goals.length+' obiettivi.</p><p class="note" style="color:var(--urgent);font-weight:700">Sostituisce tutti i dati che hai adesso su questo dispositivo.</p>'
      +'<div class="foot"><div class="r"><button class="btn ghost" data-act="close">Annulla</button><button class="btn primary" data-act="restore-ok">Sì, ripristina</button></div></div>',{restore:nd});
  };
  rd.readAsText(f);
}

/* ---------- azioni ---------- */
function arm(btn){
  if(btn.dataset.armed==='1')return true;
  btn.dataset.armed='1';btn.dataset.label=btn.textContent;btn.textContent='Tocca ancora per confermare';btn.classList.add('armed');
  setTimeout(()=>{if(btn.isConnected){btn.dataset.armed='';btn.textContent=btn.dataset.label;btn.classList.remove('armed')}},3500);
  return false;
}
function goalUpdate(gid,fn){const g=D.goals.find(x=>x.id===gid);if(!g)return;const c=clone(g);fn(c);saveItem('goals',c)}
function histShift(dir){const H=S.hist;const now=new Date();
  if(H.mode==='giorni'){let m=H.m+dir,y=H.y;if(m<0){m=11;y--}if(m>11){m=0;y++}if(y>now.getFullYear()||(y===now.getFullYear()&&m>now.getMonth()))return;H.m=m;H.y=y}
  else{const y=H.y+dir;if(y>now.getFullYear())return;H.y=y}
  render()}

const ACT={
  tab(b){S.tab=b.dataset.tab;try{localStorage.setItem('sg-tab',S.tab)}catch(e){}closeSheet();render();window.scrollTo({top:0})},
  prev(){goDate(addDays(S.date,-1))},next(){goDate(addDays(S.date,1))},today(){goDate(todayKey())},
  toggle(b){const id=b.dataset.id;const d=S.day.done;if(d[id]===true)delete d[id];else d[id]=true;closeSheet();touchDay()},
  skip(b){S.day.done[b.dataset.id]='s';closeSheet();touchDay();toast('Saltato per oggi. Va bene così.')},
  unskip(b){delete S.day.done[b.dataset.id];closeSheet();touchDay()},
  itemmenu(b){openItemMenu(b.dataset.kind,b.dataset.id)},
  'req-inc'(b){const r=D.reqs.find(x=>x.id===b.dataset.id);if(!r)return;const t=Math.max(1,+r.target||1);const c=+S.day.req[r.id]||0;if(c>=t)return;
    if(r.describe){openNote(r,c,true);return}
    S.day.req[r.id]=c+1;touchDay();if(c+1===t)toast(r.title+': fatto!')},
  'req-dec'(b){const id=b.dataset.id;const c=+S.day.req[id]||0;if(c<=0)return;S.day.req[id]=c-1;const n=arr(S.day.notes[id]);if(n.length>c-1)S.day.notes[id]=n.slice(0,c-1);touchDay()},
  'req-tog'(b){const r=D.reqs.find(x=>x.id===b.dataset.id);if(!r)return;const on=(+S.day.req[r.id]||0)>=1;
    if(on){S.day.req[r.id]=0;delete S.day.notes[r.id];touchDay();return}
    if(r.describe){openNote(r,0,true);return}
    S.day.req[r.id]=1;touchDay()},
  'note-edit'(b){const r=D.reqs.find(x=>x.id===b.dataset.id);if(r)openNote(r,+b.dataset.i,false)},
  'note-skip'(){applyNote('')},
  'note-del'(){removeNote()},
  'todo-tog'(b){const t=S.day.todos.find(x=>x.id===b.dataset.id);if(t){t.done=!t.done;touchDay()}},
  'todo-del'(b){S.day.todos=S.day.todos.filter(x=>x.id!==b.dataset.id);touchDay()},
  'todo-later'(b){
    const t=S.day.todos.find(x=>x.id===b.dataset.id);if(!t)return;const nk=addDays(S.date,1);
    S.day.todos=S.day.todos.filter(x=>x!==t);
    mutateDay(nk,nb=>{if(!nb.todos.some(x=>x.id===t.id))nb.todos.push({...t,done:false})});
    touchDay();toast('Spostato a '+(nk===addDays(todayKey(),1)?'domani':shortDate(nk)));
  },
  carry(){const p=S.prevLeft;if(!p)return;const ids=new Set(p.left.map(t=>t.id));
    const have=new Set(S.day.todos.map(t=>t.id));p.left.forEach(t=>{if(!have.has(t.id))S.day.todos.push({...t})});
    mutateDay(p.key,nb=>{nb.todos=nb.todos.filter(t=>!ids.has(t.id))});S.prevLeft=null;touchDay()},
  'step-tog'(b){const sid=b.dataset.id;goalUpdate(b.dataset.goal,g=>{const s=arr(g.steps).find(x=>x.id===sid);if(s)s.done=!s.done})},
  'step-del'(b){const sid=b.dataset.id;goalUpdate(b.dataset.goal,g=>{g.steps=arr(g.steps).filter(x=>x.id!==sid)})},
  'goal-done'(b){const g=D.goals.find(x=>x.id===b.dataset.id);const was=g&&g.done;goalUpdate(b.dataset.id,c=>{c.done=!c.done;c.doneAt=c.done?todayKey():null});if(g&&!was)toast('Obiettivo raggiunto. Complimenti!')},
  gfilter(b){S.goalFilter=b.dataset.v;render()},
  hmode(b){S.hist.mode=b.dataset.v;render()},
  hprev(){histShift(-1)},hnext(){histShift(1)},
  openday(b){S.tab='oggi';goDate(b.dataset.k)},
  openmonth(b){S.hist.mode='giorni';S.hist.m=+b.dataset.arg;render()},
  openyear(b){S.hist.mode='mesi';S.hist.y=+b.dataset.arg;render()},
  new(b){openForm(b.dataset.kind)},
  edit(b){openForm(b.dataset.kind,b.dataset.id)},
  'del-item'(b){if(!arm(b))return;const {kind,id}=sheetCtx;closeSheet();removeItem(kind,id);toast('Eliminato')},
  'clear-past'(b){if(!arm(b))return;const tk=todayKey();D.events=D.events.filter(e=>e.weekly||e.date>=tk);commit();render();toast('Impegni passati eliminati')},
  'clear-ex'(b){if(!arm(b))return;KINDS.forEach(k=>{D[k]=D[k].filter(x=>!x.example)});commit();render();toast('Esempi rimossi')},
  backup(){doBackup()},
  restore(){const i=$('#restore-in');i.value='';i.click()},
  'restore-ok'(){const nd=sheetCtx&&sheetCtx.restore;if(!nd)return;D=nd;persist();closeSheet();loadDay();render();toast('Backup ripristinato')},
  'dismiss-tip'(){try{localStorage.setItem('sg-tip','1')}catch(e){}$('#banner').hidden=true},
  fab(){openChooser()},
  close(){closeSheet()},
  'quick-todo'(){closeSheet();if(S.tab!=='oggi'){S.tab='oggi';render()}const i=$('#todo-in');if(i){i.scrollIntoView({block:'center'});i.focus()}}
};

document.addEventListener('click',ev=>{
  const p=ev.target.closest('[data-preset]');
  if(p){const v=p.dataset.preset;const set=v==='all'?ALLDAYS:v==='work'?[0,1,2,3,4]:[5,6];p.closest('form').querySelectorAll('input[name=days]').forEach(c=>{c.checked=set.includes(+c.value)});return}
  if(ev.target===$('#backdrop')){closeSheet();return}
  const b=ev.target.closest('[data-act],[data-tab]');if(!b||b.disabled)return;
  const a=b.dataset.act||'tab';const fn=ACT[a];if(fn){ev.preventDefault();fn(b)}
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==='f-item'){submitForm(f);return}
  if(f.id==='f-note'){applyNote(String(new FormData(f).get('note')||'').trim());return}
  if(f.id==='todo-form'){const i=f.querySelector('input');const v=i.value.trim();if(!v)return;S.day.todos.push({id:uid(),text:v,done:false});i.value='';touchDay();setTimeout(()=>{const n=$('#todo-in');if(n)n.focus()},0);return}
  if(f.classList.contains('step-form')){const i=f.querySelector('input');const v=i.value.trim();if(!v)return;const gid=f.dataset.goal;i.value='';
    goalUpdate(gid,g=>{g.steps=arr(g.steps).concat({id:uid(),text:v,done:false})});setTimeout(()=>{const n=document.getElementById('step-in-'+gid);if(n)n.focus()},50)}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='focus-in'){const v=t.value.trim();if(v!==S.day.focus){S.day.focus=v;touchDay()}}
  else if(t.id==='f-describe'){const w=$('#f-prompt-wrap');if(w)w.hidden=!t.checked}
  else if(t.id==='restore-in'&&t.files&&t.files[0])onRestoreFile(t.files[0]);
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#backdrop').hidden)closeSheet();
  if(ev.key==='Enter'&&ev.target.id==='focus-in'){ev.preventDefault();ev.target.blur()}
});
/* se la scheda è aperta in due schede del browser, resta allineata */
window.addEventListener('storage',e=>{if(e.key===LS_KEY&&e.newValue){const d=loadData();if(d){D=d;loadDay();render()}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

let lastToday=todayKey();
function tick(){const t=todayKey();if(t!==lastToday){const was=S.date===lastToday;lastToday=t;if(was){goDate(t);return}}if(S.tab==='oggi'&&$('#backdrop').hidden)render()}
setInterval(tick,60000);

/* ---------- avvio ---------- */
(function boot(){
  const tabs=['oggi','obiettivi','storico','imposta'];
  const h=(location.hash||'').slice(1);let saved=null;try{saved=localStorage.getItem('sg-tab')}catch(e){}
  S.tab=tabs.includes(h)?h:tabs.includes(saved)?saved:'oggi';
  loadDay();persist();render();
  let storageWorks=true;try{localStorage.setItem('sg-test','1');localStorage.removeItem('sg-test')}catch(e){storageWorks=false}
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  let tipSeen=false;try{tipSeen=localStorage.getItem('sg-tip')==='1'}catch(e){}
  const b=$('#banner');
  if(!storageWorks){b.innerHTML='<span>Questo browser non permette di salvare: le modifiche restano solo finché la pagina è aperta. Se sei in navigazione privata, aprila in una finestra normale.</span>';b.hidden=false}
  else if(ios&&!standalone&&!tipSeen){b.innerHTML='<span><b>Per non perdere i dati:</b> tocca Condividi → "Aggiungi alla schermata Home" e usa la scheda sempre da quell\'icona. Safari e l\'icona tengono memorie separate.</span><button data-act="dismiss-tip" aria-label="Chiudi avviso">OK</button>';b.hidden=false}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
</script>
</body>
</html>
